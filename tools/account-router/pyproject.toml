[build-system]
requires = ["uv_build>=0.11.19,<0.12"]
build-backend = "uv_build"

[project]
name = "codex-account-router"
version = "0.1.0"
description = "Separate stock Codex control and execution accounts"
requires-python = ">=3.12"
dependencies = ["aiohttp>=3.13,<4"]

[project.scripts]
codex-account-router = "codex_account_router.cli:main"

[dependency-groups]
dev = ["ruff>=0.15.8"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "C4"]
ignore = ["E501"]
