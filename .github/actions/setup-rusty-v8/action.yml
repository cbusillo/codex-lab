name: setup-rusty-v8
description: Download and verify Codex-built rusty_v8 artifacts for Cargo builds.
inputs:
  target:
    description: Rust target triple with Codex-built V8 release artifacts.
    required: true
  artifact-repository:
    description: >-
      Repository (owner/name) publishing the `rusty-v8-v*` releases. Defaults to
      the repository running the build so a fork never links V8 blobs it did not
      publish.
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Configure rusty_v8 artifact overrides and verify checksums
      shell: bash
      env:
        TARGET: ${{ inputs.target }}
        RUSTY_V8_ARTIFACT_REPOSITORY: ${{ inputs.artifact-repository }}
      run: bash "${GITHUB_WORKSPACE}/.github/scripts/download-rusty-v8-artifacts.sh"
