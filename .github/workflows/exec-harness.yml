name: exec-harness

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/extended-checks.json"
      - ".github/workflows/ci.yml"
      - ".github/workflows/exec-harness.yml"
      - "scripts/github/decide_extended_checks.py"
      - "scripts/github/test_decide_extended_checks.py"
      - "justfile"
      - "scripts/just-shell.py"
      - "scripts/local/cleanup-space.sh"
      - "scripts/local/exec-harness-env.sh"
      - "tools/codex-exec-harness/**"
      - "codex-rs/**"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  codex-exec-harness:
    name: Codex exec harness
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on:
      - self-hosted
      - Linux
      - X64
      - codex-lab-linux
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      CODEX_EXEC_HARNESS_OUTPUT_ROOT: ${{ github.workspace }}/.tmp/codex-exec-harness-ci
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582 # 1.95.0

      - name: Use persistent target cache
        shell: bash
        env:
          CODEX_LAB_DEVELOPER_ARTIFACTS_ROOT: ${{ vars.CODEX_LAB_DEVELOPER_ARTIFACTS_ROOT }}
        run: |
          set -euo pipefail
          if [ "${RUNNER_ENVIRONMENT:-}" = "self-hosted" ]; then
            if [ -n "${CODEX_LAB_DEVELOPER_ARTIFACTS_ROOT:-}" ] && [ -d "$CODEX_LAB_DEVELOPER_ARTIFACTS_ROOT" ]; then
              target_dir="${CODEX_LAB_DEVELOPER_ARTIFACTS_ROOT%/}/github-actions/cache/${GITHUB_REPOSITORY}/exec-harness/cargo-target"
            else
              target_dir="$HOME/.cache/codex/exec-harness-target"
            fi
            mkdir -p "$target_dir"
            echo "CARGO_TARGET_DIR=$target_dir" >> "$GITHUB_ENV"
            echo "Using persistent self-hosted target cache: $target_dir"
          fi

      - name: Ensure just is available
        shell: bash
        run: |
          set -euo pipefail
          if command -v just >/dev/null 2>&1; then
            just --version
          else
            cargo install just --locked
          fi

      - name: Run exec harness unit tests
        shell: bash
        run: python3 -m unittest discover -s tools/codex-exec-harness -p 'test_*.py'

      - name: Run exec harness scenarios
        shell: bash
        run: just exec-harness-test

      - name: Upload exec harness artifacts
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: codex-exec-harness-artifacts
          path: ${{ env.CODEX_EXEC_HARNESS_OUTPUT_ROOT }}
          if-no-files-found: ignore
