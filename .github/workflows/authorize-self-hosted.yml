name: authorize self-hosted execution

on:
  workflow_call:

jobs:
  authorize:
    name: Authorize self-hosted execution
    runs-on: ubuntu-24.04
    permissions: {}
    timeout-minutes: 2
    steps:
      - name: Require a trusted initiating and triggering actor
        shell: bash
        env:
          ACTOR: ${{ github.actor }}
          TRIGGERING_ACTOR: ${{ github.triggering_actor }}
        run: |
          set -euo pipefail

          is_trusted_actor() {
            case "$1" in
              cbusillo | shiny-code-bot) return 0 ;;
              *) return 1 ;;
            esac
          }

          if ! is_trusted_actor "$ACTOR" || ! is_trusted_actor "$TRIGGERING_ACTOR"; then
            echo "::error title=Self-hosted execution denied::Only cbusillo and shiny-code-bot may initiate or rerun persistent self-hosted jobs."
            exit 1
          fi

          echo "Self-hosted execution authorized for actor=$ACTOR triggering_actor=$TRIGGERING_ACTOR."
