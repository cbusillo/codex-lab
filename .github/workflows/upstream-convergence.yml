name: Upstream Convergence Inspection

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  inspect:
    name: Inspect
    runs-on: macos-26
    timeout-minutes: 20
    concurrency:
      group: upstream-convergence-inspection
      cancel-in-progress: false
    outputs:
      candidate_due: ${{ steps.summary.outputs.candidate_due }}
      candidate_gate_status: ${{ steps.summary.outputs.candidate_gate_status }}
      candidate_base: ${{ steps.summary.outputs.candidate_base }}
      candidate_upstream: ${{ steps.summary.outputs.candidate_upstream }}
      candidate_local: ${{ steps.summary.outputs.candidate_local }}
      candidate_snapshot: ${{ steps.summary.outputs.candidate_snapshot }}
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure canonical upstream provenance
        run: |
          set -euo pipefail
          git remote add openai https://github.com/openai/codex.git
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          git fetch --no-tags openai +refs/heads/main:refs/remotes/openai/main

      - name: Run convergence inspection
        id: inspection
        run: |
          set -euo pipefail
          started_at=$(python3 - <<'PY'
          from datetime import datetime, timezone
          print(datetime.now(timezone.utc).isoformat().replace('+00:00', 'Z'))
          PY
          )
          report_dir="$RUNNER_TEMP/upstream-convergence"
          raw_report="$report_dir/report.json"
          diagnostics="$report_dir/diagnostics.json"
          mkdir -p "$report_dir"
          BASE=$(git merge-base HEAD refs/remotes/openai/main)
          UPSTREAM=$(git rev-parse refs/remotes/openai/main)
          LOCAL=$(git rev-parse HEAD)

          echo "Base: $BASE"
          echo "Upstream: $UPSTREAM"
          echo "Local: $LOCAL"

          status=0
          python3 .github/scripts/upstream_convergence.py inspect \
            --base "$BASE" \
            --upstream "$UPSTREAM" \
            --local "$LOCAL" \
            --json > "$raw_report" || status=$?

          finished_at=$(python3 - <<'PY'
          from datetime import datetime, timezone
          print(datetime.now(timezone.utc).isoformat().replace('+00:00', 'Z'))
          PY
          )
          started_epoch=$(python3 - "$started_at" <<'PY'
          import sys
          from datetime import datetime

          print(int(datetime.fromisoformat(sys.argv[1].replace('Z', '+00:00')).timestamp() * 1000))
          PY
          )
          finished_epoch=$(python3 - "$finished_at" <<'PY'
          import sys
          from datetime import datetime

          print(int(datetime.fromisoformat(sys.argv[1].replace('Z', '+00:00')).timestamp() * 1000))
          PY
          )
          duration_ms=$((finished_epoch - started_epoch))

          RAW_REPORT="$raw_report" DIAGNOSTICS="$diagnostics" INSPECT_STATUS="$status" \
            INSPECTION_STARTED_AT="$started_at" INSPECTION_DURATION_MS="$duration_ms" \
            python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          report_path = Path(os.environ["RAW_REPORT"])
          diagnostics_path = Path(os.environ["DIAGNOSTICS"])
          status = int(os.environ["INSPECT_STATUS"])
          try:
              report = json.loads(report_path.read_text(encoding="utf-8"))
          except (OSError, UnicodeError, json.JSONDecodeError) as error:
              report = {"errors": [f"unable to read inspection report: {error}"]}
          if not isinstance(report, dict):
              report = {
                  "errors": [
                      f"inspection report must be a JSON object, got {type(report).__name__}"
                  ]
              }
          errors = report.get("errors")
          if not isinstance(errors, list):
              errors = []
          first_error = str(errors[0])[:1000] if errors else None
          diagnostics = {
              "inspectStatus": status,
              "reportBytes": report_path.stat().st_size if report_path.exists() else 0,
              "operation": report.get("operation"),
              "passed": report.get("passed"),
              "errorCount": len(errors),
              "firstError": first_error,
              "inspectionStartedAt": os.environ["INSPECTION_STARTED_AT"],
              "inspectionDurationMs": int(os.environ["INSPECTION_DURATION_MS"]),
          }
          diagnostics_path.write_text(
              json.dumps(diagnostics, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          PY
          {
            echo "status=$status"
            echo "started_at=$started_at"
            echo "finished_at=$finished_at"
            echo "duration_ms=$duration_ms"
          } >> "$GITHUB_OUTPUT"

      - name: Print bounded inspection diagnostics
        if: ${{ always() && !cancelled() && steps.inspection.outcome != 'skipped' }}
        run: |
          test -f "$RUNNER_TEMP/upstream-convergence/report.json"
          cat "$RUNNER_TEMP/upstream-convergence/diagnostics.json"

      - name: Verify inspection leaves checkout clean
        if: ${{ always() && !cancelled() && steps.inspection.outcome != 'skipped' }}
        run: |
          set -euo pipefail
          status=$(git status --porcelain=v1 --untracked-files=all)
          if [[ -n "$status" ]]; then
            printf '%s\n' "$status" | head -n 50
            exit 1
          fi

      - name: Find newest successful report
        id: previous
        if: ${{ success() && steps.inspection.outputs.status == '0' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          UPDATED_AT=""
          while read -r run_id; do
            if [[ "$run_id" == "$GITHUB_RUN_ID" ]]; then
              continue
            fi
            if completed_at=$(gh run view "$run_id" \
              --json jobs \
              --jq '[.jobs[] | select(.name == "Inspect" and .conclusion == "success") | .completedAt][0] // ""'); then
              if [[ -n "$completed_at" ]]; then
                UPDATED_AT="$completed_at"
                break
              fi
            fi
          done < <(gh run list \
            --workflow upstream-convergence.yml \
            --branch main \
            --limit 50 \
            --json databaseId \
            --jq '.[].databaseId')
          echo "updated_at=$UPDATED_AT" >> "$GITHUB_OUTPUT"

      - name: Publish compact report
        id: summary
        if: ${{ success() && steps.inspection.outputs.status == '0' }}
        env:
          PREVIOUS_SUCCESS_AT: ${{ steps.previous.outputs.updated_at }}
          INSPECTION_STARTED_AT: ${{ steps.inspection.outputs.started_at }}
          INSPECTION_FINISHED_AT: ${{ steps.inspection.outputs.finished_at }}
          INSPECTION_DURATION_MS: ${{ steps.inspection.outputs.duration_ms }}
        run: |
          set -euo pipefail
          python3 .github/scripts/upstream_convergence_report.py \
            --report "$RUNNER_TEMP/upstream-convergence/report.json" \
            --output "$RUNNER_TEMP/upstream-convergence/convergence-summary.json" \
            --previous-success-at "$PREVIOUS_SUCCESS_AT"
          SUMMARY="$RUNNER_TEMP/upstream-convergence/convergence-summary.json" \
            python3 - <<'PY'
          import json
          import os
          import re
          from pathlib import Path

          summary = json.loads(Path(os.environ["SUMMARY"]).read_text(encoding="utf-8"))
          refs = summary.get("refs")
          gate = summary.get("candidateGate")
          if not isinstance(refs, dict) or not isinstance(gate, dict):
              raise ValueError("convergence summary is missing candidate inputs")
          exact_ref = re.compile(r"[0-9a-f]{40}")
          values = {name: refs.get(name) for name in ("base", "upstream", "local")}
          if not all(isinstance(value, str) and exact_ref.fullmatch(value) for value in values.values()):
              raise ValueError("convergence summary has invalid candidate refs")
          due = gate.get("due")
          status = gate.get("status")
          snapshot = gate.get("latestIntegratedSnapshot")
          if (
              not isinstance(due, bool)
              or not isinstance(status, str)
              or len(status) > 64
              or "\n" in status
              or "\r" in status
          ):
              raise ValueError("convergence summary has invalid candidate gate")
          if snapshot is None:
              snapshot_path = ""
          elif isinstance(snapshot, dict) and isinstance(snapshot.get("snapshot"), str):
              snapshot_path = snapshot["snapshot"][:512]
          else:
              raise ValueError("convergence summary has invalid candidate snapshot")
          if "\n" in snapshot_path or "\r" in snapshot_path:
              raise ValueError("convergence summary has unsafe candidate snapshot")
          output = Path(os.environ["GITHUB_OUTPUT"])
          with output.open("a", encoding="utf-8") as output_file:
              output_file.write(
              "\n".join(
                  [
                      f"candidate_due={str(due).lower()}",
                      f"candidate_gate_status={status}",
                      f"candidate_base={values['base']}",
                      f"candidate_upstream={values['upstream']}",
                      f"candidate_local={values['local']}",
                      f"candidate_snapshot={snapshot_path}",
                  ]
              )
              + "\n"
              )
          PY

      - name: Upload raw inspection report
        if: ${{ always() && !cancelled() && steps.inspection.outcome != 'skipped' }}
        uses: actions/upload-artifact@v4
        with:
          name: upstream-convergence-raw-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/upstream-convergence/report.json
            ${{ runner.temp }}/upstream-convergence/diagnostics.json
          if-no-files-found: error
          retention-days: 14

      - name: Upload compact report
        if: ${{ success() && steps.inspection.outputs.status == '0' }}
        uses: actions/upload-artifact@v4
        with:
          name: upstream-convergence-${{ github.run_id }}
          path: ${{ runner.temp }}/upstream-convergence/convergence-summary.json
          if-no-files-found: error
          retention-days: 90

      - name: Fail when inspection fails
        if: ${{ always() && !cancelled() && steps.inspection.outcome != 'skipped' && steps.inspection.outputs.status != '0' }}
        env:
          INSPECT_STATUS: ${{ steps.inspection.outputs.status }}
        run: |
          status="$INSPECT_STATUS"
          if [[ ! "$status" =~ ^[0-9]+$ ]]; then
            status=1
          fi
          exit "$status"

  candidate:
    name: Candidate stage 3a
    needs: inspect
    if: ${{ needs.inspect.outputs.candidate_due == 'true' && needs.inspect.outputs.candidate_gate_status == 'ready' && github.ref == 'refs/heads/main' }}
    runs-on: macos-26
    timeout-minutes: 90
    permissions:
      contents: read
    concurrency:
      group: upstream-convergence-candidate-${{ github.ref }}
      cancel-in-progress: false
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      EXPECTED_BASE: ${{ needs.inspect.outputs.candidate_base }}
      EXPECTED_UPSTREAM: ${{ needs.inspect.outputs.candidate_upstream }}
      EXPECTED_LOCAL: ${{ needs.inspect.outputs.candidate_local }}
      CANDIDATE_GATE_STATUS: ${{ needs.inspect.outputs.candidate_gate_status }}
      CANDIDATE_SNAPSHOT: ${{ needs.inspect.outputs.candidate_snapshot }}
    steps:
      - name: Checkout integration repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Re-fetch canonical refs and run data-only candidate preflight
        id: candidate
        run: |
          set -euo pipefail
          evidence_dir="$RUNNER_TEMP/upstream-convergence-candidate-evidence"
          candidate_dir="$RUNNER_TEMP/upstream-convergence-candidate"
          downloads_dir="$RUNNER_TEMP/upstream-convergence-candidate-downloads"
          trusted_helper="$RUNNER_TEMP/upstream-candidate-preflight.py"
          trusted_guard="$RUNNER_TEMP/upstream-convergence-guard.json"
          trusted_gates="$RUNNER_TEMP/upstream-convergence-gates.json"
          trusted_extractor="$RUNNER_TEMP/extract_ci_root_failures.py"
          conflicts="$evidence_dir/conflict-paths.txt"
          all_conflicts="$RUNNER_TEMP/upstream-convergence-all-conflicts.txt"
          preflight="$evidence_dir/rusty-v8-preflight.json"
          mkdir -p "$evidence_dir"
          printf '%s\n' '{"schemaVersion":1,"classification":"infrastructure","reason":"candidate stage did not complete"}' > "$evidence_dir/candidate-bootstrap.json"
          classification=infrastructure
          reason="candidate preflight did not start"
          worktree_removed=true
          primary_checkout_clean=true
          conflict_total=0
          helper_ready=true
          if ! cp .github/scripts/upstream_candidate_preflight.py "$trusted_helper"; then
            helper_ready=false
            reason="unable to materialize trusted candidate helper"
          elif ! cp upstream/convergence-guard.json "$trusted_guard"; then
            helper_ready=false
            reason="unable to materialize trusted convergence guard"
          elif ! cp upstream/convergence-gates.json "$trusted_gates"; then
            helper_ready=false
            reason="unable to materialize trusted convergence gates"
          elif ! cp .github/scripts/extract_ci_root_failures.py "$trusted_extractor"; then
            helper_ready=false
            reason="unable to materialize trusted root-failure extractor"
          fi
          if [[ "$helper_ready" == true ]]; then
            {
              echo "trusted_helper_sha=$(/usr/bin/shasum -a 256 "$trusted_helper" | /usr/bin/awk '{print $1}')"
              echo "trusted_guard_sha=$(/usr/bin/shasum -a 256 "$trusted_guard" | /usr/bin/awk '{print $1}')"
              echo "trusted_gates_sha=$(/usr/bin/shasum -a 256 "$trusted_gates" | /usr/bin/awk '{print $1}')"
              echo "trusted_extractor_sha=$(/usr/bin/shasum -a 256 "$trusted_extractor" | /usr/bin/awk '{print $1}')"
            } >> "$GITHUB_OUTPUT"
          fi

          cleanup_worktree() {
            if [[ -e "$candidate_dir" ]]; then
              git worktree remove --force "$candidate_dir" || return 1
            fi
            git worktree prune
            [[ ! -e "$candidate_dir" ]]
          }
          trap 'cleanup_worktree || true' EXIT

          if [[ "$helper_ready" != true ]]; then
            :
          elif [[ ! "$EXPECTED_BASE" =~ ^[0-9a-f]{40}$ || ! "$EXPECTED_UPSTREAM" =~ ^[0-9a-f]{40}$ || ! "$EXPECTED_LOCAL" =~ ^[0-9a-f]{40}$ ]]; then
            reason="inspect outputs did not contain exact 40-hex refs"
          else
            git remote remove openai 2>/dev/null || true
            if ! git remote set-url origin https://github.com/cbusillo/codex-lab.git; then
              reason="unable to configure canonical origin URL"
            elif ! git remote add openai https://github.com/openai/codex.git; then
              reason="unable to configure canonical openai URL"
            elif [[ "$(git remote get-url origin)" != "https://github.com/cbusillo/codex-lab.git" ]]; then
              reason="origin URL is not canonical"
            elif [[ "$(git remote get-url openai)" != "https://github.com/openai/codex.git" ]]; then
              reason="openai URL is not canonical"
            elif ! git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main; then
              reason="unable to fetch canonical origin/main"
            elif ! git fetch --no-tags openai +refs/heads/main:refs/remotes/openai/main; then
              reason="unable to fetch canonical openai/main"
            elif ! git cat-file -e "${EXPECTED_BASE}^{commit}" || ! git cat-file -e "${EXPECTED_UPSTREAM}^{commit}" || ! git cat-file -e "${EXPECTED_LOCAL}^{commit}"; then
              reason="inspect refs are not available as commits"
            elif ! git merge-base --is-ancestor "$EXPECTED_LOCAL" refs/remotes/origin/main; then
              reason="inspect local ref is not reachable from canonical origin/main"
            elif ! git merge-base --is-ancestor "$EXPECTED_UPSTREAM" refs/remotes/openai/main; then
              reason="inspect upstream ref is not reachable from canonical openai/main"
            elif [[ "$(git merge-base "$EXPECTED_LOCAL" "$EXPECTED_UPSTREAM")" != "$EXPECTED_BASE" ]]; then
              reason="inspect merge base does not match the pinned refs"
            elif ! git -c core.hooksPath=/dev/null worktree add --detach "$candidate_dir" "$EXPECTED_UPSTREAM"; then
              reason="unable to create isolated upstream worktree"
            elif git -C "$candidate_dir" -c core.hooksPath=/dev/null merge --no-commit --no-ff "$EXPECTED_LOCAL"; then
              preflight_status=0
              python3 "$trusted_helper" preflight \
                --candidate-dir "$candidate_dir" \
                --download-dir "$downloads_dir" \
                --output "$preflight" || preflight_status=$?
              if (( preflight_status == 0 )); then
                classification=clean
                reason="upstream-first merge and trusted rusty_v8 preflight passed"
              elif (( preflight_status == 3 )); then
                classification="preflight-blocked"
                reason="candidate data does not have a usable rusty_v8 artifact set"
                echo "::warning title=Upstream convergence artifact preflight::Stage 3a recorded a candidate artifact blocker; this is not an infrastructure failure."
              else
                reason="trusted rusty_v8 preflight failed"
              fi
            else
              git -C "$candidate_dir" diff --name-only --diff-filter=U > "$all_conflicts"
              conflict_total=$(wc -l < "$all_conflicts" | tr -d ' ')
              LC_ALL=C sort "$all_conflicts" | sed -n '1,200p' > "$conflicts"
              if [[ -s "$conflicts" ]]; then
                classification=conflict
                reason="upstream-first merge has conflicts; compilation is deferred to stage 3b"
                echo "::warning title=Upstream convergence candidate conflict::Stage 3a recorded bounded conflict evidence; this is not an infrastructure failure."
              else
                reason="upstream-first merge failed without conflict paths"
              fi
            fi
          fi

          keep_candidate=false
          if [[ "$classification" == clean ]]; then
            keep_candidate=true
            worktree_removed=false
          elif ! cleanup_worktree; then
            classification=infrastructure
            reason="temporary candidate worktree cleanup failed"
            worktree_removed=false
          fi
          if [[ -n "$(git status --porcelain=v1 --untracked-files=all)" ]]; then
            classification=infrastructure
            reason="primary checkout is not clean after candidate preflight"
            primary_checkout_clean=false
          fi
          if [[ "$helper_ready" == true ]]; then
            evidence_classification="$classification"
            [[ "$keep_candidate" == true ]] && evidence_classification=validation-pending
            python3 "$trusted_helper" write-evidence \
              --classification "$evidence_classification" \
              --reason "$reason" \
              --base "$EXPECTED_BASE" \
              --upstream "$EXPECTED_UPSTREAM" \
              --local "$EXPECTED_LOCAL" \
              --gate-status "$CANDIDATE_GATE_STATUS" \
              --snapshot "$CANDIDATE_SNAPSHOT" \
              --conflicts "$conflicts" \
              --conflict-total "$conflict_total" \
              --preflight "$preflight" \
              --worktree-removed "$worktree_removed" \
              --primary-checkout-clean "$primary_checkout_clean" \
              --output-dir "$evidence_dir" \
              --workflow-sha "$GITHUB_SHA" \
              --run-id "$GITHUB_RUN_ID"
            rm -f "$evidence_dir/candidate-bootstrap.json"
          fi
          if [[ "$keep_candidate" == true ]]; then
            echo "stage3b_ready=true" >> "$GITHUB_OUTPUT"
            echo "RUSTY_V8_ARCHIVE=$downloads_dir/librusty_v8_ptrcomp_sandbox_release_aarch64-apple-darwin.a.gz" >> "$GITHUB_ENV"
            echo "RUSTY_V8_SRC_BINDING_PATH=$downloads_dir/src_binding_ptrcomp_sandbox_release_aarch64-apple-darwin.rs" >> "$GITHUB_ENV"
            trap - EXIT
          else
            echo "stage3b_ready=false" >> "$GITHUB_OUTPUT"
            trap - EXIT
          fi
          echo "classification=$classification" >> "$GITHUB_OUTPUT"
          if [[ "$classification" == infrastructure ]]; then
            exit 1
          fi

      - name: Install pinned Rust toolchain
        if: ${{ steps.candidate.outputs.stage3b_ready == 'true' }}
        uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582
        with:
          toolchain: 1.95.0

      - name: Run bounded candidate checks and select affected contracts
        id: candidate_checks
        if: ${{ steps.candidate.outputs.stage3b_ready == 'true' }}
        env:
          CARGO_INCREMENTAL: "0"
          RUSTFLAGS: "-C debuginfo=0"
          CARGO_TARGET_DIR: ${{ runner.temp }}/upstream-convergence-cargo-target
          RUSTY_V8_ARCHIVE: ${{ runner.temp }}/upstream-convergence-candidate-downloads/librusty_v8_ptrcomp_sandbox_release_aarch64-apple-darwin.a.gz
          RUSTY_V8_SRC_BINDING_PATH: ${{ runner.temp }}/upstream-convergence-candidate-downloads/src_binding_ptrcomp_sandbox_release_aarch64-apple-darwin.rs
          TRUSTED_HELPER_SHA: ${{ steps.candidate.outputs.trusted_helper_sha }}
          TRUSTED_GUARD_SHA: ${{ steps.candidate.outputs.trusted_guard_sha }}
          TRUSTED_GATES_SHA: ${{ steps.candidate.outputs.trusted_gates_sha }}
          TRUSTED_EXTRACTOR_SHA: ${{ steps.candidate.outputs.trusted_extractor_sha }}
        run: |
          set -euo pipefail
          evidence_dir="$RUNNER_TEMP/upstream-convergence-candidate-evidence"
          candidate_dir="$RUNNER_TEMP/upstream-convergence-candidate"
          trusted_helper="$RUNNER_TEMP/upstream-candidate-preflight.py"
          trusted_guard="$RUNNER_TEMP/upstream-convergence-guard.json"
          trusted_gates="$RUNNER_TEMP/upstream-convergence-gates.json"
          trusted_extractor="$RUNNER_TEMP/extract_ci_root_failures.py"
          candidate_dir=$(realpath "$candidate_dir")
          evidence_dir=$(realpath "$evidence_dir")
          trusted_helper=$(realpath "$trusted_helper")
          trusted_guard=$(realpath "$trusted_guard")
          trusted_gates=$(realpath "$trusted_gates")
          trusted_extractor=$(realpath "$trusted_extractor")
          sandbox_profile="$(realpath "$RUNNER_TEMP")/upstream-candidate.sb"
          workspace=$(realpath "$GITHUB_WORKSPACE")
          github_env_path=$(realpath "$GITHUB_ENV")
          github_output_path=$(realpath "$GITHUB_OUTPUT")
          github_path_file=$(realpath "$GITHUB_PATH")
          python_bin=$(command -v python3)
          cargo_bin=$(command -v cargo)
          cargo_home="$(realpath "$RUNNER_TEMP")/upstream-cargo-home"
          cargo_target=$(mkdir -p "$CARGO_TARGET_DIR" && realpath "$CARGO_TARGET_DIR")
          candidate_path="$(dirname "$python_bin"):$(dirname "$cargo_bin"):/usr/bin:/bin:/usr/sbin:/sbin"
          repo_logs="$evidence_dir/repo-check-logs"
          repo_results="$evidence_dir/repo-check-results.tsv"
          repo_outcome="$evidence_dir/repo-check-outcome.json"
          affected="$evidence_dir/affected-contracts.json"
          cargo_outcome="$evidence_dir/cargo-check-outcome.json"
          root_outcome="$evidence_dir/root-failure-outcome.json"
          upstream_paths="$evidence_dir/upstream-changed-paths.txt"
          local_paths="$evidence_dir/local-changed-paths.txt"
          mkdir -p "$repo_logs" "$cargo_home"
          : > "$repo_results"
          printf '%s\n' '{"status":"not-run"}' > "$repo_outcome"
          printf '%s\n' '{"status":"not-run"}' > "$affected"
          printf '%s\n' '{"status":"not-run"}' > "$cargo_outcome"
          printf '%s\n' '{"status":"not-run"}' > "$root_outcome"
          repo_infrastructure=0
          repo_regression=0

          verify_trusted() {
            [[ "$(/usr/bin/shasum -a 256 "$trusted_helper" | /usr/bin/awk '{print $1}')" == "$TRUSTED_HELPER_SHA" ]] &&
            [[ "$(/usr/bin/shasum -a 256 "$trusted_guard" | /usr/bin/awk '{print $1}')" == "$TRUSTED_GUARD_SHA" ]] &&
            [[ "$(/usr/bin/shasum -a 256 "$trusted_gates" | /usr/bin/awk '{print $1}')" == "$TRUSTED_GATES_SHA" ]] &&
            [[ "$(/usr/bin/shasum -a 256 "$trusted_extractor" | /usr/bin/awk '{print $1}')" == "$TRUSTED_EXTRACTOR_SHA" ]]
          }
          record_stage3b() {
            verify_trusted && python3 "$trusted_helper" record-stage3b \
              --evidence "$evidence_dir/candidate-evidence.json" --repo-checks "$repo_outcome" \
              --cargo-check "$cargo_outcome" --affected-contracts "$affected" --root-failures "$root_outcome"
          }
          cat > "$sandbox_profile" <<EOF
          (version 1)
          (allow default)
          (deny file-write* (subpath "$workspace"))
          (deny file-write* (subpath "$candidate_dir"))
          (deny file-write* (subpath "$evidence_dir"))
          (deny file-write* (subpath "$(realpath "$HOME")"))
          (deny file-write* (subpath "$(dirname "$python_bin")"))
          (deny file-write* (subpath "$(dirname "$cargo_bin")"))
          (allow file-write* (subpath "$cargo_home"))
          (allow file-write* (subpath "$cargo_target"))
          (deny file-write* (literal "$trusted_helper"))
          (deny file-write* (literal "$trusted_guard"))
          (deny file-write* (literal "$trusted_gates"))
          (deny file-write* (literal "$trusted_extractor"))
          (deny file-write* (literal "$sandbox_profile"))
          (deny file-write* (literal "$github_env_path"))
          (deny file-write* (literal "$github_output_path"))
          (deny file-write* (literal "$github_path_file"))
          EOF
          trap 'record_stage3b || true' EXIT
          verify_trusted

          for index in 0 1 2 3; do
            case "$index" in
              0) name="convergence gates"; command=(python3 .github/scripts/upstream_convergence_gates.py --json) ;;
              1) name="convergence guard"; command=(python3 .github/scripts/upstream_convergence_guard.py --json) ;;
              2) name="convergence governance"; command=(python3 .github/scripts/verify_upstream_convergence_governance.py --json) ;;
              3) name="repo-check test registration"; command=(python3 .github/scripts/verify_repo_checks_test_registration.py) ;;
            esac
            log="$repo_logs/$index.log"
            set +e
            (cd "$candidate_dir" && sandbox-exec -f "$sandbox_profile" env -u RUNNER_TEMP -u GITHUB_ENV -u GITHUB_OUTPUT -u GITHUB_PATH -u GITHUB_STATE PATH="$candidate_path" CARGO_HOME="$cargo_home" "${command[@]}") 2>&1 \
              | python3 "$trusted_helper" bound-log --output "$log"
            pipeline_status=("${PIPESTATUS[@]}")
            set -e
            status="${pipeline_status[0]}"
            logger_status="${pipeline_status[1]}"
            if [[ "$logger_status" != 0 ]]; then
              classification=infrastructure
              status=1
            elif [[ "$status" == 0 ]]; then
              classification=passed
            else
              verify_trusted
              classification=$(python3 "$trusted_helper" classify-failure --status "$status" --log "$log")
            fi
            if [[ "$classification" == infrastructure ]]; then
              repo_infrastructure=1
            elif [[ "$classification" == regression ]]; then
              repo_regression=1
            fi
            printf '%s\t%s\t%s\t%s\n' "$name" "${command[*]}" "$status" "$classification" >> "$repo_results"
            cat "$log"
          done

          python3 - "$repo_results" "$repo_outcome" "$repo_infrastructure" "$repo_regression" <<'PY'
          import json
          import sys
          from pathlib import Path

          results = []
          for line in Path(sys.argv[1]).read_text(encoding="utf-8").splitlines():
              name, command, status, classification = line.split("\t")
              results.append({"name": name, "command": command, "status": int(status), "classification": classification})
          outcome = {
              "status": "failed" if any(result["status"] for result in results) else "passed",
              "classification": "infrastructure" if sys.argv[3] == "1" else ("regression" if sys.argv[4] == "1" else "passed"),
              "checks": results,
          }
          Path(sys.argv[2]).write_text(json.dumps(outcome, indent=2, sort_keys=True) + "\n", encoding="utf-8")
          PY

          cargo_log="$evidence_dir/cargo-check.log"
          set +e
          (cd "$candidate_dir/codex-rs" && sandbox-exec -f "$sandbox_profile" env -u RUNNER_TEMP -u GITHUB_ENV -u GITHUB_OUTPUT -u GITHUB_PATH -u GITHUB_STATE PATH="$candidate_path" CARGO_HOME="$cargo_home" cargo check --workspace --tests --locked) 2>&1 \
            | python3 "$trusted_helper" bound-log --output "$cargo_log"
          cargo_pipeline_status=("${PIPESTATUS[@]}")
          set -e
          cargo_status="${cargo_pipeline_status[0]}"
          cargo_logger_status="${cargo_pipeline_status[1]}"
          if [[ "$cargo_logger_status" != 0 ]]; then
            cargo_classification=infrastructure
            cargo_status=1
          elif [[ "$cargo_status" == 0 ]]; then
            cargo_classification=passed
          else
            verify_trusted
            cargo_classification=$(python3 "$trusted_helper" classify-failure --status "$cargo_status" --log "$cargo_log")
          fi
          cat "$cargo_log"
          python3 - "$cargo_outcome" "$cargo_status" "$cargo_classification" "$cargo_log" <<'PY'
          import json
          import sys
          from pathlib import Path

          outcome = {
              "status": "passed" if sys.argv[2] == "0" else "failed",
              "classification": sys.argv[3],
              "command": "cargo check --workspace --tests --locked",
              "workingDirectory": "codex-rs",
              "log": Path(sys.argv[4]).read_text(encoding="utf-8"),
          }
          Path(sys.argv[1]).write_text(json.dumps(outcome, indent=2, sort_keys=True) + "\n", encoding="utf-8")
          PY

          git -C "$candidate_dir" -c core.quotePath=false diff --no-renames -z --name-only "$EXPECTED_BASE" "$EXPECTED_UPSTREAM" > "$upstream_paths"
          git -C "$candidate_dir" -c core.quotePath=false diff --no-renames -z --name-only "$EXPECTED_BASE" "$EXPECTED_LOCAL" > "$local_paths"
          verify_trusted
          python3 "$trusted_helper" select-affected-contracts \
            --gates "$trusted_gates" --upstream-paths "$upstream_paths" --local-paths "$local_paths" \
            --candidate-dir "$candidate_dir" --output "$affected"

          root_input="$evidence_dir/root-failure-input.json"
          root_report="$evidence_dir/root-failure-report.json"
          python3 - "$root_input" "$repo_results" "$cargo_status" <<'PY'
          import json
          import sys
          from pathlib import Path

          jobs = []
          for index, line in enumerate(Path(sys.argv[2]).read_text(encoding="utf-8").splitlines()):
              name, _command, status, _classification = line.split("\t")
              conclusion = "success" if status == "0" else "failure"
              jobs.append({"id": f"candidate-repo-check-{index}", "name": name, "conclusion": conclusion, "steps": [{"name": name, "conclusion": conclusion}]})
          cargo_success = sys.argv[3] == "0"
          jobs.append({"id": "candidate-cargo-check", "name": "Candidate cargo check", "conclusion": "success" if cargo_success else "failure", "steps": [{"name": "cargo check --workspace --tests --locked", "conclusion": "success" if cargo_success else "failure"}]})
          Path(sys.argv[1]).write_text(
              json.dumps({"jobs": jobs}, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          PY
          root_status=0
          verify_trusted
          python3 "$trusted_extractor" \
            --input "$root_input" \
            --max-input-bytes 65536 \
            --max-output-bytes 32768 \
            --max-roots 50 \
            --max-sources-per-root 8 > "$root_report" || root_status=$?
          if [[ "$root_status" != 0 ]] || (( $(wc -c < "$root_report") > 32768 )); then
            printf '%s\n' '{"status":"failed","classification":"infrastructure"}' > "$root_outcome"
            root_infrastructure=1
          else
            python3 - "$root_outcome" "$root_report" <<'PY'
          import json
          import sys
          from pathlib import Path

          report = json.loads(Path(sys.argv[2]).read_text(encoding="utf-8"))
          Path(sys.argv[1]).write_text(
              json.dumps({"status": "extracted", "classification": "passed", "report": report}, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          PY
            root_infrastructure=0
          fi

          record_stage3b
          trap - EXIT
          if (( repo_regression == 1 )); then
            echo "::warning title=Candidate repository-check regression::Stage 3b repository checks failed; candidate evidence records a regression while preserving a green job."
          fi
          if [[ "$cargo_classification" == regression ]]; then
            echo "::warning title=Candidate cargo regression::Stage 3b cargo check failed; candidate evidence records a regression while preserving a green job."
          fi
          if (( repo_infrastructure == 1 )) || [[ "$cargo_classification" == infrastructure ]] || (( root_infrastructure == 1 )); then
            exit 1
          fi

      - name: Build bounded model packets
        if: ${{ always() && !cancelled() && steps.candidate.outcome != 'skipped' }}
        env:
          TRUSTED_HELPER_SHA: ${{ steps.candidate.outputs.trusted_helper_sha }}
          TRUSTED_GUARD_SHA: ${{ steps.candidate.outputs.trusted_guard_sha }}
          TRUSTED_GATES_SHA: ${{ steps.candidate.outputs.trusted_gates_sha }}
        run: |
          set -euo pipefail
          evidence_dir="$RUNNER_TEMP/upstream-convergence-candidate-evidence"
          trusted_helper="$RUNNER_TEMP/upstream-candidate-preflight.py"
          trusted_guard="$RUNNER_TEMP/upstream-convergence-guard.json"
          trusted_gates="$RUNNER_TEMP/upstream-convergence-gates.json"
          verify_trusted() {
            [[ -f "$trusted_helper" && -f "$trusted_guard" && -f "$trusted_gates" ]] &&
            [[ "$(/usr/bin/shasum -a 256 "$trusted_helper" | /usr/bin/awk '{print $1}')" == "$TRUSTED_HELPER_SHA" ]] &&
            [[ "$(/usr/bin/shasum -a 256 "$trusted_guard" | /usr/bin/awk '{print $1}')" == "$TRUSTED_GUARD_SHA" ]] &&
            [[ "$(/usr/bin/shasum -a 256 "$trusted_gates" | /usr/bin/awk '{print $1}')" == "$TRUSTED_GATES_SHA" ]]
          }
          verify_trusted
          started_at=$(python3 - <<'PY'
          from datetime import datetime, timezone
          print(datetime.now(timezone.utc).isoformat().replace('+00:00', 'Z'))
          PY
          )
          set +e
          python3 "$trusted_helper" build-packets \
            --evidence "$evidence_dir/candidate-evidence.json" \
            --guard "$trusted_guard" \
            --gates "$trusted_gates" \
            --conflicts "$evidence_dir/conflict-paths.txt" \
            --root-failures "$evidence_dir/root-failure-outcome.json" \
            --output-dir "$evidence_dir" \
            --cycle-id "$GITHUB_RUN_ID.$GITHUB_RUN_ATTEMPT" \
            --started-at "$started_at" \
            --duration-ms 0
          status=$?
          set -e
          for output in model-packets.json model-packets.txt model-telemetry.json; do
            test -f "$evidence_dir/$output"
          done
          if [[ "$status" != 0 ]]; then
            exit "$status"
          fi

      - name: Verify candidate cleanup and primary checkout
        if: ${{ always() && !cancelled() && steps.candidate.outcome != 'skipped' }}
        run: |
          set -euo pipefail
          worktree_removed=true
          if [[ -e "$RUNNER_TEMP/upstream-convergence-candidate" ]]; then
            if ! git worktree remove --force "$RUNNER_TEMP/upstream-convergence-candidate"; then
              worktree_removed=false
            fi
          fi
          if ! git worktree prune || [[ -e "$RUNNER_TEMP/upstream-convergence-candidate" ]]; then
            worktree_removed=false
          fi
          status=$(git status --porcelain=v1 --untracked-files=all)
          primary_checkout_clean=true
          if [[ -n "$status" ]]; then
            printf '%s\n' "$status" | head -n 50
            primary_checkout_clean=false
          fi
          python3 - \
            "$RUNNER_TEMP/upstream-convergence-candidate-evidence/candidate-evidence.json" \
            "$worktree_removed" \
            "$primary_checkout_clean" <<'PY'
          import json
          import sys
          from pathlib import Path

          path = Path(sys.argv[1])
          if not path.exists():
              raise SystemExit(0)
          evidence = json.loads(path.read_text(encoding="utf-8"))
          evidence["temporaryWorktreeRemoved"] = sys.argv[2] == "true"
          evidence["primaryCheckoutClean"] = sys.argv[3] == "true"
          path.write_text(json.dumps(evidence, indent=2, sort_keys=True) + "\n", encoding="utf-8")
          text_path = path.with_name("candidate-evidence.txt")
          lines = [
              line
              for line in text_path.read_text(encoding="utf-8").splitlines()
              if not line.startswith(("temporary worktree removed:", "primary checkout clean:"))
          ]
          lines.extend(
              [
                  f"temporary worktree removed: {evidence['temporaryWorktreeRemoved']}",
                  f"primary checkout clean: {evidence['primaryCheckoutClean']}",
              ]
          )
          text_path.write_text("\n".join(lines) + "\n", encoding="utf-8")
          PY
          if [[ "$worktree_removed" != true || "$primary_checkout_clean" != true ]]; then
            exit 1
          fi

      - name: Upload candidate evidence
        if: ${{ always() && !cancelled() && steps.candidate.outcome != 'skipped' }}
        uses: actions/upload-artifact@v4
        with:
          name: upstream-convergence-candidate-${{ github.run_id }}
          path: ${{ runner.temp }}/upstream-convergence-candidate-evidence
          if-no-files-found: error
          retention-days: 90
