name: ci

on:
  pull_request: {}
  push: { branches: [main] }

jobs:
  extended-checks-decision:
    name: Extended checks decision
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Decide extended checks
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          PR_HEAD_REPO: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name || github.repository }}
        run: |
          set -euo pipefail
          python3 scripts/github/decide_extended_checks.py --validate-config
          python3 scripts/github/decide_extended_checks.py \
            --event-name "$EVENT_NAME" \
            --base "$BASE_SHA" \
            --head "$HEAD_SHA" \
            --format markdown | tee -a "$GITHUB_STEP_SUMMARY"

  python-checks:
    name: Python and repository checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Verify codex-rs Cargo manifests inherit workspace settings
        run: python3 .github/scripts/verify_cargo_workspace_manifests.py

      - name: Verify codex-tui does not import codex-core directly
        run: python3 .github/scripts/verify_tui_core_boundary.py

      - name: Verify Bazel clippy flags match Cargo workspace lints
        run: python3 .github/scripts/verify_bazel_clippy_lints.py

      - name: Test Codex package builder
        run: python3 -m unittest discover -s scripts/codex_package -p 'test_*.py'

      - name: Test Codex Lab app package builder
        run: python3 -m unittest discover -s scripts/codex_lab_package -p 'test_*.py'

      - name: Test local developer scripts
        run: python3 -m unittest discover -s scripts/local -p 'test_*.py'

      - name: Test local artifact cleanup scripts
        run: python3 -m unittest tools/codex-exec-harness/test_local_cleanup.py

      - name: Test GitHub workflow helper scripts
        run: python3 -m unittest discover -s scripts/github -p 'test_*.py'

      - name: Test npm staging helper
        run: python3 -m unittest discover -s scripts -p 'test_stage_npm_packages.py'

      - name: Smoke test Codex Lab app package layout
        shell: bash
        run: |
          set -euo pipefail
          output_dir="${RUNNER_TEMP}/codex-lab-smoke"
          fake_codex="${output_dir}/fake-codex"
          mkdir -p "$output_dir"
          cat > "$fake_codex" <<'EOF'
          #!/bin/sh
          if [ "${1:-}" = debug ] && [ "${2:-}" = provenance ] && [ "${3:-}" = --json ]; then
            printf '{"schema_version":1,"version":"0.0.0","source_commit":"0000000000000000000000000000000000000000","dirty_state":"clean","build_profile":"ci","build_channel":"lab","executable_path":"%s"}\n' "$0"
            exit 0
          fi
          exec /bin/sh "$@"
          EOF
          chmod +x "$fake_codex"
          python3 scripts/build_codex_lab_app.py \
            --codex-bin "$fake_codex" \
            --app-dir "${output_dir}/Codex Lab.app" \
            --shim-dir "${output_dir}/bin" \
            --force
          python3 scripts/codex_lab_package/smoke.py \
            "${output_dir}/Codex Lab.app" \
            --shim-path "${output_dir}/bin/codex-lab"

      - name: Ensure root README.md contains only ASCII and certain Unicode code points
        run: ./scripts/asciicheck.py README.md

      - name: Check root README ToC
        run: python3 scripts/readme_toc.py README.md

  npm-package:
    name: Stage npm package
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CODEX_VERSION: 0.133.0-alpha.4
      NODE_OPTIONS: --max-old-space-size=4096
      STAGE_NPM_ARTIFACTS_CACHE_DIR: .cache/codex-npm-artifacts
      ARTIFACT_REPO_CACHE_KEY: openai-codex
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@a8198c4bff370c8506180b035930dea56dbd5288 # v5
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Restore native npm artifacts cache
        uses: actions/cache@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5.0.4
        with:
          path: ${{ env.STAGE_NPM_ARTIFACTS_CACHE_DIR }}
          key: codex-npm-artifacts-${{ runner.os }}-${{ env.CODEX_VERSION }}-${{ env.ARTIFACT_REPO_CACHE_KEY }}-${{ hashFiles('scripts/stage_npm_packages.py', 'codex-cli/scripts/build_npm_package.py') }}

      - name: Stage npm package
        id: stage_npm_package
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          OUTPUT_DIR="${RUNNER_TEMP}"
          python3 ./scripts/stage_npm_packages.py \
            --release-version "$CODEX_VERSION" \
            --package codex \
            --artifacts-cache-dir "$STAGE_NPM_ARTIFACTS_CACHE_DIR" \
            --output-dir "$OUTPUT_DIR"
          PACK_OUTPUT="${OUTPUT_DIR}/codex-npm-${CODEX_VERSION}.tgz"
          echo "pack_output=$PACK_OUTPUT" >> "$GITHUB_OUTPUT"

      - name: Upload staged npm package artifact
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: codex-npm-staging
          path: ${{ steps.stage_npm_package.outputs.pack_output }}

  format-checks:
    name: Formatting checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      NODE_OPTIONS: --max-old-space-size=4096
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@a8198c4bff370c8506180b035930dea56dbd5288 # v5
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - uses: taiki-e/install-action@44c6d64aa62cd779e873306675c7a58e86d6d532 # v2.62.49
        with:
          tool: just@1.51.0
      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.3"
      - name: Check formatting (run `just fmt` to fix)
        run: just fmt-check

      - name: Prettier (run `pnpm run format:fix` to fix)
        run: pnpm run format

  build-test:
    name: build-test
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs:
      - extended-checks-decision
      - python-checks
      - npm-package
      - format-checks
    if: ${{ always() }}
    steps:
      - name: Check split CI jobs
        shell: bash
        run: |
          set -euo pipefail
          extended_checks_decision="${{ needs.extended-checks-decision.result }}"
          python_checks="${{ needs.python-checks.result }}"
          npm_package="${{ needs.npm-package.result }}"
          format_checks="${{ needs.format-checks.result }}"
          echo "extended-checks-decision: $extended_checks_decision"
          echo "python-checks: $python_checks"
          echo "npm-package: $npm_package"
          echo "format-checks: $format_checks"
          if [[ "$extended_checks_decision" != "success" || "$python_checks" != "success" || "$npm_package" != "success" || "$format_checks" != "success" ]]; then
            exit 1
          fi
