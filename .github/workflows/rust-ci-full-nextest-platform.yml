name: rust-ci-full nextest platform

on:
  workflow_call:
    inputs:
      runner:
        required: true
        type: string
      target:
        required: true
        type: string
      profile:
        required: true
        type: string
      artifact_id:
        required: true
        type: string
      remote_env:
        required: false
        default: false
        type: boolean
      remote_test_filter:
        required: false
        default: ""
        type: string
      test_threads:
        required: false
        default: 0
        type: number
      use_sccache:
        required: false
        default: false
        type: boolean

jobs:
  archive:
    name: Build nextest archive
    runs-on: ${{ inputs.runner }}
    # Run 30205457451 cancelled the Linux ARM64 archive at exactly 60 minutes;
    # cold-cache archive builds need headroom above that.
    timeout-minutes: 90
    defaults:
      run:
        working-directory: codex-rs
    env:
      USE_SCCACHE: ${{ inputs.use_sccache && 'true' || 'false' }}
      CARGO_INCREMENTAL: "0"
      SCCACHE_CACHE_SIZE: 10G
      NEXTEST_ARCHIVE_FILE: nextest-${{ inputs.artifact_id }}.tar.zst
      TEST_HELPERS_ARTIFACT: nextest-test-helpers-${{ inputs.artifact_id }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - id: setup_ci
        uses: ./.github/actions/setup-ci

      - name: Install Linux build dependencies
        if: ${{ runner.os == 'Linux' }}
        shell: bash
        run: |
          set -euo pipefail
          if command -v apt-get >/dev/null 2>&1; then
            if [[ "$(id -u)" -eq 0 ]]; then
              apt_prefix=()
            elif sudo -n true 2>/dev/null; then
              apt_prefix=(sudo)
            else
              echo "No passwordless sudo; assuming Linux runner dependencies are preinstalled."
              exit 0
            fi
            "${apt_prefix[@]}" apt-get update -y
            "${apt_prefix[@]}" env DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends pkg-config libcap-dev
          fi

      - uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582 # 1.95.0
        with:
          targets: ${{ inputs.target }}

      - if: ${{ !contains(inputs.target, 'windows') }}
        name: Configure rusty_v8 artifact overrides and verify checksums
        uses: ./.github/actions/setup-rusty-v8
        with:
          target: ${{ inputs.target }}
          # Full CI only compiles and tests this repository; it publishes no
          # artifacts. Release workflows keep the same-repository default.
          artifact-repository: openai/codex

      # Runs 30201090398, 30201567036, and 30202380677 all lost the hosted ARM
      # runner during final archive linking with Cargo's default parallelism.
      - name: Limit Cargo build concurrency on Linux ARM64
        if: ${{ runner.os == 'Linux' && runner.arch == 'ARM64' }}
        shell: bash
        run: echo "CARGO_BUILD_JOBS=2" >> "$GITHUB_ENV"

      - name: Expose MSVC SDK environment (Windows)
        if: ${{ runner.os == 'Windows' && inputs.target == 'aarch64-pc-windows-msvc' }}
        uses: ./.github/actions/setup-msvc-env
        with:
          target: ${{ inputs.target }}

      - name: Compute lockfile hash
        id: lockhash
        shell: bash
        run: |
          set -euo pipefail
          echo "hash=$(shasum -a 256 Cargo.lock | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
          echo "toolchain_hash=$(shasum -a 256 rust-toolchain.toml | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      - name: Restore cargo home cache
        id: cache_cargo_home_restore
        uses: actions/cache/restore@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5.0.4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
          key: cargo-home-v2-${{ steps.setup_ci.outputs.cache-scope }}-${{ inputs.runner }}-${{ inputs.target }}-${{ inputs.profile }}-${{ steps.lockhash.outputs.hash }}-${{ steps.lockhash.outputs.toolchain_hash }}
          restore-keys: |
            cargo-home-v2-${{ steps.setup_ci.outputs.cache-scope }}-${{ inputs.runner }}-${{ inputs.target }}-${{ inputs.profile }}-

      - name: Install sccache
        if: ${{ env.USE_SCCACHE == 'true' }}
        uses: taiki-e/install-action@44c6d64aa62cd779e873306675c7a58e86d6d532 # v2.62.49
        with:
          tool: sccache
          version: 0.7.5

      - name: Configure sccache backend
        if: ${{ env.USE_SCCACHE == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "${ACTIONS_CACHE_URL:-}" && -n "${ACTIONS_RUNTIME_TOKEN:-}" ]]; then
            echo "SCCACHE_GHA_ENABLED=true" >> "$GITHUB_ENV"
            echo "Using sccache GitHub backend"
          else
            echo "SCCACHE_GHA_ENABLED=false" >> "$GITHUB_ENV"
            echo "SCCACHE_DIR=${CI_BUILD_ROOT}/sccache" >> "$GITHUB_ENV"
            echo "Using sccache local disk + actions/cache fallback"
          fi

      - name: Enable sccache wrapper
        if: ${{ env.USE_SCCACHE == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          wrapper="$(command -v sccache)"
          if [[ "${RUNNER_OS}" == "Windows" ]] && command -v cygpath >/dev/null 2>&1; then
            wrapper="$(cygpath -w "${wrapper}")"
          fi
          echo "RUSTC_WRAPPER=${wrapper}" >> "$GITHUB_ENV"
          echo "CARGO_BUILD_RUSTC_WRAPPER=${wrapper}" >> "$GITHUB_ENV"

      - name: Restore sccache cache (fallback)
        if: ${{ env.USE_SCCACHE == 'true' && env.SCCACHE_GHA_ENABLED != 'true' }}
        id: cache_sccache_restore
        uses: actions/cache/restore@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5.0.4
        with:
          path: ${{ env.SCCACHE_DIR }}
          key: sccache-v2-${{ steps.setup_ci.outputs.cache-scope }}-${{ inputs.runner }}-${{ inputs.target }}-${{ inputs.profile }}-${{ steps.lockhash.outputs.hash }}-${{ github.run_id }}
          restore-keys: |
            sccache-v2-${{ steps.setup_ci.outputs.cache-scope }}-${{ inputs.runner }}-${{ inputs.target }}-${{ inputs.profile }}-${{ steps.lockhash.outputs.hash }}-
            sccache-v2-${{ steps.setup_ci.outputs.cache-scope }}-${{ inputs.runner }}-${{ inputs.target }}-${{ inputs.profile }}-

      - uses: taiki-e/install-action@44c6d64aa62cd779e873306675c7a58e86d6d532 # v2.62.49
        with:
          tool: nextest
          version: 0.9.103

      - name: Enable unprivileged user namespaces (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$(id -u)" -eq 0 ]]; then
            sysctl_prefix=()
          elif sudo -n true 2>/dev/null; then
            sysctl_prefix=(sudo)
          else
            echo "No passwordless sudo; leaving runner user-namespace settings unchanged."
            exit 0
          fi
          "${sysctl_prefix[@]}" sysctl -w kernel.unprivileged_userns_clone=1
          if "${sysctl_prefix[@]}" sysctl -a 2>/dev/null | grep -q '^kernel.apparmor_restrict_unprivileged_userns'; then
            "${sysctl_prefix[@]}" sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi

      - name: Build nextest archive
        shell: bash
        run: |
          set -euo pipefail
          archive_dir="${RUNNER_TEMP}/nextest-archive"
          mkdir -p "${archive_dir}"
          cargo nextest archive \
            --target ${{ inputs.target }} \
            --cargo-profile ${{ inputs.profile }} \
            --timings \
            --archive-file "${archive_dir}/${NEXTEST_ARCHIVE_FILE}"

      - name: Build runtime test helpers
        shell: bash
        run: |
          set -euo pipefail
          helper_dir="${RUNNER_TEMP}/${TEST_HELPERS_ARTIFACT}"
          mkdir -p "${helper_dir}"

          cargo build \
            --target ${{ inputs.target }} \
            --profile ${{ inputs.profile }} \
            -p codex-code-mode-host \
            --bin codex-code-mode-host
          if [[ "${RUNNER_OS}" == "Windows" ]]; then
            cp "${CARGO_TARGET_DIR}/${{ inputs.target }}/${{ inputs.profile }}/codex-code-mode-host.exe" "${helper_dir}/"
          elif [[ "${RUNNER_OS}" == "Windows" ]]; then
            cargo build \
              --target ${{ inputs.target }} \
              --profile ${{ inputs.profile }} \
              -p codex-shell-escalation \
              --bin codex-execve-wrapper
            cp "${CARGO_TARGET_DIR}/${{ inputs.target }}/${{ inputs.profile }}/codex-code-mode-host" "${helper_dir}/"
            cp "${CARGO_TARGET_DIR}/${{ inputs.target }}/${{ inputs.profile }}/codex-execve-wrapper" "${helper_dir}/"
          fi

          if [[ "${RUNNER_OS}" == "Linux" ]]; then
            cargo build \
              --target ${{ inputs.target }} \
              --profile ${{ inputs.profile }} \
              -p codex-linux-sandbox \
              --bin codex-linux-sandbox
            cargo build \
              --target ${{ inputs.target }} \
              --profile ${{ inputs.profile }} \
              -p codex-bwrap \
              --bin bwrap
            cp "${CARGO_TARGET_DIR}/${{ inputs.target }}/${{ inputs.profile }}/codex-linux-sandbox" "${helper_dir}/"
            cp "${CARGO_TARGET_DIR}/${{ inputs.target }}/${{ inputs.profile }}/bwrap" "${helper_dir}/"
            if [[ "${{ inputs.remote_env }}" == "true" ]]; then
              cargo build \
                --target ${{ inputs.target }} \
                --profile ${{ inputs.profile }} \
                -p codex-cli \
                --bin codex
              cp "${CARGO_TARGET_DIR}/${{ inputs.target }}/${{ inputs.profile }}/codex" "${helper_dir}/"
            fi
          else
            cargo build \
              --target ${{ inputs.target }} \
              --profile ${{ inputs.profile }} \
              -p codex-windows-sandbox \
              --bin codex-windows-sandbox-setup \
              --bin codex-command-runner
            cp "${CARGO_TARGET_DIR}/${{ inputs.target }}/${{ inputs.profile }}/codex-windows-sandbox-setup.exe" "${helper_dir}/"
            cp "${CARGO_TARGET_DIR}/${{ inputs.target }}/${{ inputs.profile }}/codex-command-runner.exe" "${helper_dir}/"
          fi

      - name: Upload Cargo timings (nextest)
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: cargo-timings-rust-ci-nextest-${{ inputs.target }}-${{ inputs.profile }}
          path: ${{ env.CARGO_TARGET_DIR }}/**/cargo-timings/cargo-timing.html
          if-no-files-found: warn

      - name: Upload nextest archive
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: nextest-archive-${{ inputs.artifact_id }}
          path: ${{ runner.temp }}/nextest-archive/${{ env.NEXTEST_ARCHIVE_FILE }}
          if-no-files-found: error
          retention-days: 1

      - name: Upload runtime test helpers
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: ${{ env.TEST_HELPERS_ARTIFACT }}
          path: ${{ runner.temp }}/${{ env.TEST_HELPERS_ARTIFACT }}/*
          if-no-files-found: error
          retention-days: 1

      - name: Save cargo home cache
        if: always() && !cancelled() && steps.cache_cargo_home_restore.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5.0.4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
          key: cargo-home-v2-${{ steps.setup_ci.outputs.cache-scope }}-${{ inputs.runner }}-${{ inputs.target }}-${{ inputs.profile }}-${{ steps.lockhash.outputs.hash }}-${{ steps.lockhash.outputs.toolchain_hash }}

      - name: Save sccache cache (fallback)
        if: always() && !cancelled() && env.USE_SCCACHE == 'true' && env.SCCACHE_GHA_ENABLED != 'true'
        continue-on-error: true
        uses: actions/cache/save@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5.0.4
        with:
          path: ${{ env.SCCACHE_DIR }}
          key: sccache-v2-${{ steps.setup_ci.outputs.cache-scope }}-${{ inputs.runner }}-${{ inputs.target }}-${{ inputs.profile }}-${{ steps.lockhash.outputs.hash }}-${{ github.run_id }}

      - name: sccache stats
        if: always() && env.USE_SCCACHE == 'true'
        continue-on-error: true
        run: sccache --show-stats || true

      - name: sccache summary
        if: always() && env.USE_SCCACHE == 'true'
        shell: bash
        run: |
          {
            echo "### sccache stats — ${{ inputs.target }} (tests)";
            echo;
            echo '```';
            sccache --show-stats || true;
            echo '```';
          } >> "$GITHUB_STEP_SUMMARY"

  shard:
    name: Tests shard ${{ matrix.shard }}/4
    needs: archive
    runs-on: ${{ inputs.runner }}
    # Slower hosted lanes can approach the former 60-minute wall after reducing
    # process concurrency to match runner capacity.
    timeout-minutes: 90
    defaults:
      run:
        working-directory: codex-rs
    env:
      NEXTEST_ARCHIVE_FILE: nextest-${{ inputs.artifact_id }}.tar.zst
      TEST_HELPERS_ARTIFACT: nextest-test-helpers-${{ inputs.artifact_id }}
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-ci

      - name: Install Linux build dependencies
        if: ${{ runner.os == 'Linux' }}
        shell: bash
        run: |
          set -euo pipefail
          if command -v apt-get >/dev/null 2>&1; then
            if [[ "$(id -u)" -eq 0 ]]; then
              apt_prefix=()
            elif sudo -n true 2>/dev/null; then
              apt_prefix=(sudo)
            else
              echo "No passwordless sudo; assuming Linux runner dependencies are preinstalled."
              exit 0
            fi
            "${apt_prefix[@]}" apt-get update -y
            "${apt_prefix[@]}" env DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends pkg-config libcap-dev
          fi

      - uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582 # 1.95.0
        with:
          targets: ${{ inputs.target }}

      - uses: taiki-e/install-action@44c6d64aa62cd779e873306675c7a58e86d6d532 # v2.62.49
        with:
          tool: nextest
          version: 0.9.103

      - name: Enable unprivileged user namespaces (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$(id -u)" -eq 0 ]]; then
            sysctl_prefix=()
          elif sudo -n true 2>/dev/null; then
            sysctl_prefix=(sudo)
          else
            echo "No passwordless sudo; leaving runner user-namespace settings unchanged."
            exit 0
          fi
          "${sysctl_prefix[@]}" sysctl -w kernel.unprivileged_userns_clone=1
          if "${sysctl_prefix[@]}" sysctl -a 2>/dev/null | grep -q '^kernel.apparmor_restrict_unprivileged_userns'; then
            "${sysctl_prefix[@]}" sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi

      - name: Download nextest archive
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: nextest-archive-${{ inputs.artifact_id }}
          path: ${{ runner.temp }}/nextest-archive

      - name: Download runtime test helpers
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ env.TEST_HELPERS_ARTIFACT }}
          path: ${{ runner.temp }}/${{ env.TEST_HELPERS_ARTIFACT }}

      - name: tests
        id: test
        shell: bash
        run: |
          set -euo pipefail
          archive_file="${RUNNER_TEMP}/nextest-archive/${NEXTEST_ARCHIVE_FILE}"
          workspace_root="$(pwd)"
          junit_dir="${RUNNER_TEMP}/nextest-junit"
          # Nextest resolves its configured store directory from the remapped
          # workspace root, independently of Cargo's target directory.
          junit_source="${workspace_root}/target/nextest/default/junit.xml"
          mkdir -p "${junit_dir}"

          if [[ "${RUNNER_OS}" == "Linux" ]]; then
            original_home="${HOME}"
            export RUSTUP_HOME="${RUSTUP_HOME:-${original_home}/.rustup}"
            export CARGO_HOME="${CARGO_HOME:-${original_home}/.cargo}"
            export DOCKER_CONFIG="${DOCKER_CONFIG:-${original_home}/.docker}"
            export XDG_CACHE_HOME="${XDG_CACHE_HOME:-${original_home}/.cache}"
            export HOME="${RUNNER_TEMP}/nextest-home-native"
            mkdir -p "${HOME}"
            unset HTTP_PROXY HTTPS_PROXY ALL_PROXY http_proxy https_proxy all_proxy
          fi

          if [[ "${RUNNER_OS}" == "Windows" ]]; then
            archive_file="$(cygpath -w "${archive_file}")"
            workspace_root="$(cygpath -w "${workspace_root}")"
          fi
          export CODEX_CARGO_WORKSPACE_ROOT="${workspace_root}"
          export INSTA_WORKSPACE_ROOT="${workspace_root}"

          helper_dir="${RUNNER_TEMP}/${TEST_HELPERS_ARTIFACT}"
          helper_target_dir="${CARGO_TARGET_DIR}/${{ inputs.target }}/${{ inputs.profile }}"
          mkdir -p "${helper_target_dir}"
          if [[ "${RUNNER_OS}" == "Windows" ]]; then
            code_mode_host="${helper_target_dir}/codex-code-mode-host.exe"
            cp "${helper_dir}/codex-code-mode-host.exe" "${code_mode_host}"
          else
            code_mode_host="${helper_target_dir}/codex-code-mode-host"
            execve_wrapper="${helper_target_dir}/codex-execve-wrapper"
            cp "${helper_dir}/codex-code-mode-host" "${code_mode_host}"
            cp "${helper_dir}/codex-execve-wrapper" "${execve_wrapper}"
            chmod +x "${code_mode_host}" "${execve_wrapper}"
          fi

          if [[ "${RUNNER_OS}" == "Linux" ]]; then
            cp "${helper_dir}/codex-linux-sandbox" "${helper_target_dir}/"
            chmod +x "${helper_target_dir}/codex-linux-sandbox"
            test_tools_dir="${RUNNER_TEMP}/codex-test-tools"
            mkdir -p "${test_tools_dir}" "${helper_target_dir}/codex-resources"
            cp "${helper_dir}/bwrap" "${test_tools_dir}/bwrap"
            cp "${helper_dir}/bwrap" "${helper_target_dir}/codex-resources/bwrap"
            chmod +x "${test_tools_dir}/bwrap" "${helper_target_dir}/codex-resources/bwrap"
            export PATH="${test_tools_dir}:${PATH}"
            if ! "${test_tools_dir}/bwrap" --ro-bind / / --dev /dev true; then
              echo "::error::Vendored bubblewrap cannot create the required user namespace on this runner"
              id
              sysctl kernel.unprivileged_userns_clone 2>/dev/null || true
              sysctl kernel.apparmor_restrict_unprivileged_userns 2>/dev/null || true
              exit 1
            fi
          elif [[ "${RUNNER_OS}" == "Windows" ]]; then
            cp "${helper_dir}/codex-windows-sandbox-setup.exe" "${helper_target_dir}/"
            cp "${helper_dir}/codex-command-runner.exe" "${helper_target_dir}/"
          fi

          nextest_args=(
            run
            --archive-file "${archive_file}"
            --workspace-remap "${workspace_root}"
            --partition "hash:${{ matrix.shard }}/4"
            --no-fail-fast
          )
          if [[ "${{ inputs.test_threads }}" != "0" ]]; then
            nextest_args+=(--test-threads "${{ inputs.test_threads }}")
          fi

          run_nextest() {
            if [[ "${RUNNER_OS}" == "Linux" ]]; then
              local sandbox_helper="${helper_target_dir}/codex-linux-sandbox"
              env \
                "CARGO_BIN_EXE_codex-code-mode-host=${code_mode_host}" \
                "CARGO_BIN_EXE_codex_code_mode_host=${code_mode_host}" \
                "CARGO_BIN_EXE_codex-execve-wrapper=${execve_wrapper}" \
                "CARGO_BIN_EXE_codex_execve_wrapper=${execve_wrapper}" \
                "CARGO_BIN_EXE_codex-linux-sandbox=${sandbox_helper}" \
                "CARGO_BIN_EXE_codex_linux_sandbox=${sandbox_helper}" \
                cargo nextest "$@"
            elif [[ "${RUNNER_OS}" == "Windows" ]]; then
              local setup_helper
              local command_runner
              local code_mode_host_win
              setup_helper="$(cygpath -w "${helper_target_dir}/codex-windows-sandbox-setup.exe")"
              command_runner="$(cygpath -w "${helper_target_dir}/codex-command-runner.exe")"
              code_mode_host_win="$(cygpath -w "${code_mode_host}")"
              env \
                "CARGO_BIN_EXE_codex-code-mode-host=${code_mode_host_win}" \
                "CARGO_BIN_EXE_codex_code_mode_host=${code_mode_host_win}" \
                "CARGO_BIN_EXE_codex_windows_sandbox_setup=${setup_helper}" \
                "CARGO_BIN_EXE_codex_command_runner=${command_runner}" \
                cargo nextest "$@"
            else
              env \
                "CARGO_BIN_EXE_codex-code-mode-host=${code_mode_host}" \
                "CARGO_BIN_EXE_codex_code_mode_host=${code_mode_host}" \
                "CARGO_BIN_EXE_codex-execve-wrapper=${execve_wrapper}" \
                "CARGO_BIN_EXE_codex_execve_wrapper=${execve_wrapper}" \
                cargo nextest "$@"
            fi
          }

          copy_junit_report() {
            local phase="$1"
            if [[ -f "${junit_source}" ]]; then
              cp "${junit_source}" "${junit_dir}/${phase}.xml"
            else
              echo "::error::nextest did not write the expected JUnit report: ${junit_source}"
              return 1
            fi
          }

          if [[ "${{ inputs.remote_env }}" == "true" ]]; then
            if [[ "${RUNNER_OS}" != "Linux" ]]; then
              echo "::error::remote_env is supported only on Linux"
              exit 1
            fi
            if [[ -z "${REMOTE_TEST_FILTER}" ]]; then
              echo "::error::remote_test_filter is required when remote_env is true"
              exit 1
            fi
          fi

          rm -f "${junit_source}"
          set +e
          run_nextest "${nextest_args[@]}"
          native_status=$?
          set -e
          copy_junit_report native
          if [[ "${native_status}" -ne 0 ]]; then
            exit "${native_status}"
          fi

          if [[ "${{ inputs.remote_env }}" == "true" ]]; then
            export CODEX_TEST_REMOTE_ENV_CONTAINER_NAME="codex-remote-test-env-${{ github.run_id }}-${{ matrix.shard }}"
            export CODEX_TEST_REMOTE_CODEX_BINARY="${helper_dir}/codex"
            export HOME="${RUNNER_TEMP}/nextest-home-remote"
            mkdir -p "${HOME}"
            chmod +x "${CODEX_TEST_REMOTE_CODEX_BINARY}"
            trap 'docker rm -f "${CODEX_TEST_REMOTE_ENV_CONTAINER_NAME:-}" >/dev/null 2>&1 || true' EXIT
            setup_remote_test_env() {
              source "${GITHUB_WORKSPACE}/scripts/test-remote-env.sh"
            }
            setup_remote_test_env

            remote_nextest_args=("${nextest_args[@]}" --filterset "${REMOTE_TEST_FILTER}")
            rm -f "${junit_source}"
            set +e
            run_nextest "${remote_nextest_args[@]}"
            remote_status=$?
            set -e
            copy_junit_report remote
            if [[ "${remote_status}" -ne 0 ]]; then
              docker logs "${CODEX_TEST_REMOTE_ENV_CONTAINER_NAME}" || true
            fi
            codex_remote_env_cleanup
            trap - EXIT
            exit "${remote_status}"
          fi
        env:
          RUST_BACKTRACE: 1
          RUST_MIN_STACK: "8388608" # 8 MiB
          NEXTEST_STATUS_LEVEL: leak
          REMOTE_TEST_FILTER: ${{ inputs.remote_test_filter }}

      - name: Upload nextest JUnit report
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: nextest-junit-rust-ci-${{ inputs.artifact_id }}-shard-${{ matrix.shard }}
          path: ${{ runner.temp }}/nextest-junit/*.xml
          if-no-files-found: error

      - name: verify tests passed
        if: steps.test.outcome == 'failure'
        run: |
          echo "Tests failed. See logs for details."
          exit 1

  result:
    name: Platform result
    needs: shard
    if: always()
    runs-on: macos-26
    steps:
      - name: Confirm test shards passed
        shell: bash
        run: |
          if [[ "${{ needs.shard.result }}" != "success" ]]; then
            echo "Nextest shards finished with result: ${{ needs.shard.result }}" >&2
            exit 1
          fi
