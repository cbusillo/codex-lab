name: rust-ci-full
on:
  workflow_call:
  push:
    branches:
      # Keep this opt-in branch trigger for developers who want the full suite
      # before merging. Nightly and manual orchestration enters through
      # full-ci.yml.
      - "**full-ci**"
  workflow_dispatch:

concurrency:
  group: rust-ci-full::${{ github.workflow }}::${{ github.ref }}
  cancel-in-progress: true

jobs:
  authorize_self_hosted:
    name: Authorize self-hosted execution
    uses: ./.github/workflows/authorize-self-hosted.yml

  # --- CI that doesn't need specific targets ---------------------------------
  general:
    name: Format / etc
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: codex-rs
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-ci
      - uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582 # 1.95.0
        with:
          components: rustfmt
      - name: cargo fmt
        run: cargo fmt -- --config imports_granularity=Item --check
      - name: Rust benchmark smoke test
        run: just bench-smoke

  cargo_shear:
    name: cargo shear
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: codex-rs
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-ci
      - uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582 # 1.95.0
      - uses: taiki-e/install-action@44c6d64aa62cd779e873306675c7a58e86d6d532 # v2.62.49
        with:
          tool: cargo-shear@1.11.2
      - name: cargo shear
        run: cargo shear --deny-warnings

  argument_comment_lint_package:
    name: Argument comment lint package
    runs-on: ubuntu-24.04
    env:
      CARGO_DYLINT_VERSION: 5.0.0
      DYLINT_LINK_VERSION: 5.0.0
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-ci
      - uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582 # 1.95.0
        with:
          toolchain: nightly-2025-09-18
          components: llvm-tools-preview, rustc-dev, rust-src
      - name: Cache cargo-dylint tooling
        id: cargo_dylint_cache
        uses: actions/cache@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5.0.4
        with:
          path: |
            ~/.cargo/bin/cargo-dylint
            ~/.cargo/bin/dylint-link
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: argument-comment-lint-${{ runner.os }}-${{ env.CARGO_DYLINT_VERSION }}-${{ env.DYLINT_LINK_VERSION }}-${{ hashFiles('tools/argument-comment-lint/Cargo.lock', 'tools/argument-comment-lint/rust-toolchain', '.github/workflows/rust-ci.yml', '.github/workflows/rust-ci-full.yml', '.github/workflows/rust-ci-full-argument-comment-lint.yml') }}
      - name: Install cargo-dylint tooling
        if: ${{ steps.cargo_dylint_cache.outputs.cache-hit != 'true' }}
        shell: bash
        run: |
          cargo install --locked cargo-dylint --version "$CARGO_DYLINT_VERSION"
          cargo install --locked dylint-link --version "$DYLINT_LINK_VERSION"
      - name: Check Python wrapper syntax
        run: python3 -m py_compile tools/argument-comment-lint/wrapper_common.py tools/argument-comment-lint/run.py tools/argument-comment-lint/run-prebuilt-linter.py tools/argument-comment-lint/test_wrapper_common.py
      - name: Test Python wrapper helpers
        run: python3 -m unittest discover -s tools/argument-comment-lint -p 'test_*.py'
      - name: Test argument comment lint package
        working-directory: tools/argument-comment-lint
        run: cargo test
        env:
          RUST_MIN_STACK: "8388608" # 8 MiB

  argument_comment_lint_prebuilt:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform_name: Linux
            runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - platform_name: macOS
            runner: macos-26
            target: aarch64-apple-darwin
    uses: ./.github/workflows/rust-ci-full-argument-comment-lint.yml
    with:
      platform_name: ${{ matrix.platform_name }}
      runner: ${{ matrix.runner }}
      target: ${{ matrix.target }}
    secrets: inherit

  # --- CI to validate on different os/targets --------------------------------
  lint_build:
    needs: authorize_self_hosted
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-26
            target: aarch64-apple-darwin
            profile: dev
          - runner: macos-26-intel
            target: x86_64-apple-darwin
            profile: dev
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-musl
            profile: dev
          - runner: codex-lab-linux
            target: x86_64-unknown-linux-gnu
            profile: dev
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
            profile: dev
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            profile: dev

          # Also run representative release builds on Mac and Linux because
          # there could be release-only build errors we want to catch.
          # Hopefully this also pre-populates the build cache to speed up
          # releases.
          - runner: macos-26
            target: aarch64-apple-darwin
            profile: release
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-musl
            profile: release
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
            profile: release
    uses: ./.github/workflows/rust-ci-full-lint-build.yml
    with:
      runner: ${{ matrix.runner }}
      target: ${{ matrix.target }}
      profile: ${{ matrix.profile }}

  tests_macos_aarch64:
    name: Tests — macos-26 - aarch64-apple-darwin
    uses: ./.github/workflows/rust-ci-full-nextest-platform.yml
    with:
      runner: macos-26
      target: aarch64-apple-darwin
      profile: ci-test
      artifact_id: macos-aarch64
      use_sccache: true
    secrets: inherit

  tests_linux_x64_remote:
    name: Tests — codex-lab-linux - x86_64-unknown-linux-gnu (native + remote)
    needs: authorize_self_hosted
    uses: ./.github/workflows/rust-ci-full-nextest-platform.yml
    with:
      runner: codex-lab-linux
      target: x86_64-unknown-linux-gnu
      profile: ci-test
      artifact_id: linux-x64-remote
      remote_env: true
      # The complete workspace runs natively first. Keep remote execution as a
      # positive, reviewable set until the parity gaps tracked in #505 close.
      remote_test_filter: >-
        package(codex-core) & (
          test(suite::remote_env::) |
          test(=suite::agents_md::multi_environment_thread_loads_every_project_and_keeps_creation_snapshot) |
          test(=suite::apply_patch_cli::apply_patch_turn_diff_emits_portable_paths_for_remote_cwd) |
          test(=suite::apply_patch_cli::apply_patch_turn_diff_tracks_local_and_remote_environment_paths) |
          test(=suite::rmcp_client::remote_stdio_env_var_source_does_not_copy_local_env) |
          test(=suite::skills::user_turn_includes_skill_instructions) |
          test(=suite::view_image::view_image_routes_to_selected_remote_environment)
        )
      test_threads: 4
      use_sccache: true
    secrets: inherit

  tests_linux_arm64:
    name: Tests — ubuntu-24.04-arm - aarch64-unknown-linux-gnu
    uses: ./.github/workflows/rust-ci-full-nextest-platform.yml
    with:
      runner: ubuntu-24.04-arm
      target: aarch64-unknown-linux-gnu
      profile: ci-test
      artifact_id: linux-arm64
      use_sccache: true
    secrets: inherit

  # --- Gatherer job for the full Rust workflow --------------------------------
  results:
    name: Full Rust CI results
    needs:
      [
        general,
        cargo_shear,
        argument_comment_lint_package,
        argument_comment_lint_prebuilt,
        lint_build,
        tests_macos_aarch64,
        tests_linux_x64_remote,
        tests_linux_arm64,
      ]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Require successful dependencies
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: python3 .github/scripts/check_ci_results.py

      - name: sccache summary note
        if: always()
        run: |
          echo "Per-job sccache stats are attached to each matrix job's Step Summary."
