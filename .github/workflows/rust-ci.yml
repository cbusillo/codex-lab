name: rust-ci
on:
  workflow_call:
  workflow_dispatch:

jobs:
  # --- Detect what changed so the fast PR workflow only runs relevant jobs ----
  changed:
    name: Detect changed areas
    runs-on: macos-26
    outputs:
      argument_comment_lint_package: ${{ steps.detect.outputs.argument_comment_lint_package }}
      codex: ${{ steps.detect.outputs.codex }}
      workflows: ${{ steps.detect.outputs.workflows }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Detect changed paths (no external action)
        id: detect
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            BASE_SHA='${{ github.event.pull_request.base.sha }}'
            HEAD_SHA='${{ github.event.pull_request.head.sha }}'
            echo "Base SHA: $BASE_SHA"
            echo "Head SHA: $HEAD_SHA"
            files=()
            while IFS= read -r file; do
              files+=("$file")
            done < <(git diff --name-only --no-renames "$BASE_SHA" "$HEAD_SHA")
          else
            # On manual runs, default to the full fast-PR bundle.
            files=("codex-rs/force" "tools/argument-comment-lint/force" ".github/force")
          fi

          codex=false
          argument_comment_lint_package=false
          workflows=false
          for f in "${files[@]}"; do
            [[ $f == codex-rs/* || $f == justfile || $f == .github/workflows/rust-ci.yml ]] && codex=true
            [[ $f == scripts/local/feedback_latency.py ]] && codex=true
            [[ $f == .github/actions/setup-rusty-v8/* || $f == .github/scripts/run_bazel_with_buildbuddy.py || $f == .github/scripts/rusty_v8_bazel.py || $f == .github/scripts/rusty_v8_module_bazel.py || $f == third_party/v8/rusty_v8_*_codex_release.sha256 ]] && codex=true
            [[ $f == tools/argument-comment-lint/* || $f == .github/workflows/rust-ci.yml || $f == .github/workflows/rust-ci-full.yml || $f == .github/workflows/rust-ci-full-argument-comment-lint.yml ]] && argument_comment_lint_package=true
            [[ $f == .github/* ]] && workflows=true
          done

          {
            echo "argument_comment_lint_package=$argument_comment_lint_package"
            echo "codex=$codex"
            echo "workflows=$workflows"
          } >> "$GITHUB_OUTPUT"

      - name: Check for a clean worktree
        if: always() && !cancelled()
        uses: ./.github/actions/check-clean-worktree

  # --- Fast Cargo-native PR checks -------------------------------------------
  general:
    name: Format / etc
    runs-on: macos-26
    needs: changed
    if: ${{ needs.changed.outputs.codex == 'true' || needs.changed.outputs.workflows == 'true' }}
    defaults:
      run:
        working-directory: codex-rs
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: ./.github/actions/setup-ci
      - uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582 # 1.95.0
        with:
          components: rustfmt
      - name: cargo fmt
        run: cargo fmt -- --config imports_granularity=Item --check
      - name: Rust benchmark smoke test
        run: just bench-smoke

      - name: Check for a clean worktree
        if: always() && !cancelled()
        uses: ./.github/actions/check-clean-worktree

  cargo_shear:
    name: cargo shear
    runs-on: macos-26
    needs: changed
    if: ${{ needs.changed.outputs.codex == 'true' || needs.changed.outputs.workflows == 'true' }}
    defaults:
      run:
        working-directory: codex-rs
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: ./.github/actions/setup-ci
      - uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582 # 1.95.0
      - uses: taiki-e/install-action@44c6d64aa62cd779e873306675c7a58e86d6d532 # v2.62.49
        with:
          tool: cargo-shear@1.11.2
      - name: cargo shear
        run: cargo shear --deny-warnings

      - name: Check for a clean worktree
        if: always() && !cancelled()
        uses: ./.github/actions/check-clean-worktree

  workspace_check:
    name: Rust workspace compile check
    runs-on: macos-26
    timeout-minutes: 35
    needs: changed
    if: ${{ needs.changed.outputs.codex == 'true' }}
    defaults:
      run:
        working-directory: codex-rs
    env:
      CARGO_INCREMENTAL: "0"
      SCCACHE_CACHE_SIZE: 2G
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - id: setup_ci
        uses: ./.github/actions/setup-ci
      - id: toolchain
        uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582 # 1.95.0
      - name: Restore Cargo dependency cache
        uses: actions/cache@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5.0.4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
          key: rust-workspace-check-${{ runner.os }}-${{ hashFiles('codex-rs/Cargo.lock', 'codex-rs/rust-toolchain.toml') }}
          restore-keys: |
            rust-workspace-check-${{ runner.os }}-
      - name: Select compiler cache policy
        id: compiler_cache_scope
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          cache_day="$(date -u +%Y%m%d)"
          may_save=false
          if [[ "$EVENT_NAME" == "push" && "$EVENT_REF" == "refs/heads/main" ]]; then
            may_save=true
          fi
          echo "cache-day=$cache_day" >> "$GITHUB_OUTPUT"
          echo "may-save=$may_save" >> "$GITHUB_OUTPUT"
          echo "SCCACHE_DIR=$RUNNER_TEMP/sccache" >> "$GITHUB_ENV"
          echo "Compiler cache UTC-day bucket: $cache_day"
          echo "Compiler cache save permitted: $may_save"
      # sccache writes to a bounded local directory. actions/cache owns
      # persistence. Each compatibility tuple gets at most one immutable main
      # archive per UTC day; pull requests and other events are restore-only.
      - name: Restore compiler object cache
        id: compiler_cache_restore
        uses: actions/cache/restore@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5.0.4
        with:
          path: ${{ runner.temp }}/sccache/
          key: sccache-v0.7.5-v1-${{ steps.setup_ci.outputs.cache-scope }}-${{ runner.os }}-${{ runner.arch }}-aarch64-apple-darwin-dev-toolchain-${{ steps.toolchain.outputs.cachekey }}-toolchain-file-${{ hashFiles('codex-rs/rust-toolchain.toml') }}-lock-${{ hashFiles('codex-rs/Cargo.lock') }}-trusted-main-${{ steps.compiler_cache_scope.outputs.cache-day }}
          restore-keys: |
            sccache-v0.7.5-v1-${{ steps.setup_ci.outputs.cache-scope }}-${{ runner.os }}-${{ runner.arch }}-aarch64-apple-darwin-dev-toolchain-${{ steps.toolchain.outputs.cachekey }}-toolchain-file-${{ hashFiles('codex-rs/rust-toolchain.toml') }}-lock-${{ hashFiles('codex-rs/Cargo.lock') }}-trusted-main-
      - name: Install sccache
        uses: taiki-e/install-action@44c6d64aa62cd779e873306675c7a58e86d6d532 # v2.62.49
        with:
          tool: sccache@0.7.5
      - name: Enable sccache
        shell: bash
        run: echo "RUSTC_WRAPPER=sccache" >> "$GITHUB_ENV"
      - name: Configure rusty_v8 artifact overrides
        uses: ./.github/actions/setup-rusty-v8
        with:
          target: aarch64-apple-darwin
          artifact-repository: openai/codex
      - name: Compile Rust workspace and tests
        id: workspace_compile
        run: >-
          python3 ../scripts/local/feedback_latency.py
          --lane ci-workspace-check
          --scenario warm-cache
          --output "${RUNNER_TEMP}/rust-feedback-workspace-check.json"
          --verify-rusty-v8
          -- cargo check --workspace --tests --locked

      - name: Report sccache statistics
        id: sccache_report
        if: always() && !cancelled()
        continue-on-error: true
        shell: bash
        run: |
          set -uo pipefail
          set +e
          stats="$(sccache --show-stats 2>&1)"
          stats_status=$?
          set -e
          printf '%s\n' "$stats"
          {
            echo "### sccache stats — aarch64-apple-darwin (dev)"
            echo
            echo '```text'
            printf '%s\n' "$stats"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          set +e
          sccache --stop-server
          stop_status=$?
          set -e
          if [[ "$stop_status" -eq 0 ]]; then
            echo "cache-ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::sccache server shutdown failed; cache save is disabled"
          fi
          if [[ "$stats_status" -ne 0 ]]; then
            exit "$stats_status"
          fi
          exit "$stop_status"

      - name: Save compiler object cache
        if: always() && !cancelled() && steps.compiler_cache_scope.outputs.may-save == 'true' && steps.workspace_compile.outcome == 'success' && steps.sccache_report.outputs.cache-ready == 'true' && steps.compiler_cache_restore.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5.0.4
        with:
          path: ${{ runner.temp }}/sccache/
          key: sccache-v0.7.5-v1-${{ steps.setup_ci.outputs.cache-scope }}-${{ runner.os }}-${{ runner.arch }}-aarch64-apple-darwin-dev-toolchain-${{ steps.toolchain.outputs.cachekey }}-toolchain-file-${{ hashFiles('codex-rs/rust-toolchain.toml') }}-lock-${{ hashFiles('codex-rs/Cargo.lock') }}-trusted-main-${{ steps.compiler_cache_scope.outputs.cache-day }}

      - name: Upload Rust feedback evidence
        if: always() && !cancelled()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: rust-feedback-workspace-check
          path: ${{ runner.temp }}/rust-feedback-workspace-check.json
          if-no-files-found: warn
          retention-days: 14

      - name: Check for a clean worktree
        if: always() && !cancelled()
        uses: ./.github/actions/check-clean-worktree

  argument_comment_lint_package:
    name: Argument comment lint package
    runs-on: macos-26
    needs: changed
    if: ${{ needs.changed.outputs.argument_comment_lint_package == 'true' }}
    env:
      CARGO_DYLINT_VERSION: 5.0.0
      DYLINT_LINK_VERSION: 5.0.0
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: ./.github/actions/setup-ci
      - uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582 # 1.95.0
      - name: Install nightly argument-comment-lint toolchain
        shell: bash
        run: |
          rustup toolchain install nightly-2025-09-18 \
            --profile minimal \
            --component llvm-tools-preview \
            --component rustc-dev \
            --component rust-src \
            --no-self-update
          rustup default nightly-2025-09-18
      - name: Cache cargo-dylint tooling
        id: cargo_dylint_cache
        uses: actions/cache@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5.0.4
        with:
          path: |
            ~/.cargo/bin/cargo-dylint
            ~/.cargo/bin/dylint-link
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: argument-comment-lint-${{ runner.os }}-${{ env.CARGO_DYLINT_VERSION }}-${{ env.DYLINT_LINK_VERSION }}-${{ hashFiles('tools/argument-comment-lint/Cargo.lock', 'tools/argument-comment-lint/rust-toolchain', '.github/workflows/rust-ci.yml', '.github/workflows/rust-ci-full.yml', '.github/workflows/rust-ci-full-argument-comment-lint.yml') }}
      - name: Install cargo-dylint tooling
        if: ${{ steps.cargo_dylint_cache.outputs.cache-hit != 'true' }}
        shell: bash
        run: |
          cargo install --locked cargo-dylint --version "$CARGO_DYLINT_VERSION"
          cargo install --locked dylint-link --version "$DYLINT_LINK_VERSION"
      - name: Check Python wrapper syntax
        run: python3 -m py_compile tools/argument-comment-lint/wrapper_common.py tools/argument-comment-lint/run.py tools/argument-comment-lint/run-prebuilt-linter.py tools/argument-comment-lint/test_wrapper_common.py
      - name: Test Python wrapper helpers
        run: python3 -m unittest discover -s tools/argument-comment-lint -p 'test_*.py'
      - name: Test argument comment lint package
        working-directory: tools/argument-comment-lint
        run: cargo test
        env:
          RUST_MIN_STACK: "16777216" # 16 MiB

      - name: Check for a clean worktree
        if: always() && !cancelled()
        uses: ./.github/actions/check-clean-worktree

  # --- Gatherer job that you mark as the ONLY required status -----------------
  results:
    name: CI results (required)
    needs:
      [
        changed,
        general,
        cargo_shear,
        workspace_check,
        argument_comment_lint_package,
      ]
    if: always()
    runs-on: macos-26
    steps:
      - name: Summarize
        shell: bash
        run: |
          echo "argpkg : ${{ needs.argument_comment_lint_package.result }}"
          echo "general: ${{ needs.general.result }}"
          echo "shear  : ${{ needs.cargo_shear.result }}"
          echo "compile: ${{ needs.workspace_check.result }}"

          # If nothing relevant changed (PR touching only root README, etc.),
          # declare success regardless of other jobs.
          if [[ "${NEEDS_CHANGED_OUTPUTS_ARGUMENT_COMMENT_LINT_PACKAGE}" != 'true' && "${NEEDS_CHANGED_OUTPUTS_CODEX}" != 'true' && "${NEEDS_CHANGED_OUTPUTS_WORKFLOWS}" != 'true' ]]; then
            echo 'No relevant changes -> CI not required.'
            exit 0
          fi

          if [[ "${NEEDS_CHANGED_OUTPUTS_ARGUMENT_COMMENT_LINT_PACKAGE}" == 'true' ]]; then
            [[ '${{ needs.argument_comment_lint_package.result }}' == 'success' ]] || { echo 'argument_comment_lint_package failed'; exit 1; }
          fi

          if [[ "${NEEDS_CHANGED_OUTPUTS_CODEX}" == 'true' || "${NEEDS_CHANGED_OUTPUTS_WORKFLOWS}" == 'true' ]]; then
            [[ '${{ needs.general.result }}' == 'success' ]] || { echo 'general failed'; exit 1; }
            [[ '${{ needs.cargo_shear.result }}' == 'success' ]] || { echo 'cargo_shear failed'; exit 1; }
          fi

          if [[ "${NEEDS_CHANGED_OUTPUTS_CODEX}" == 'true' ]]; then
            [[ '${{ needs.workspace_check.result }}' == 'success' ]] || { echo 'workspace_check failed'; exit 1; }
          fi
        env:
          NEEDS_CHANGED_OUTPUTS_CODEX: ${{ needs.changed.outputs.codex }}
          NEEDS_CHANGED_OUTPUTS_WORKFLOWS: ${{ needs.changed.outputs.workflows }}
          NEEDS_CHANGED_OUTPUTS_ARGUMENT_COMMENT_LINT_PACKAGE: ${{ needs.changed.outputs.argument_comment_lint_package }}
