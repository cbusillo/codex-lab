name: sdk

on:
  workflow_call:

jobs:
  python-sdk-installation:
    runs-on: macos-26
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.3"

      - name: Test the installed Python SDK and its default runtime
        working-directory: sdk/python
        shell: bash
        run: |
          set -euo pipefail
          stage="${RUNNER_TEMP}/installed-python-sdk"
          uv build --wheel --out-dir "${stage}/dist"
          uv venv "${stage}/venv"
          uv pip install --python "${stage}/venv/bin/python" "${stage}"/dist/*.whl
          mkdir -p "${stage}/home"
          env -u PYTHONPATH -u CODEX_EXEC_PATH HOME="${stage}/home" \
            "${stage}/venv/bin/python" tests/installed_sdk_smoke.py

  sdks:
    runs-on: macos-26
    # The Cargo build consumes the checksum-verified V8 artifact. Keep enough
    # headroom to distinguish a slow hosted build from the old source-V8 path.
    timeout-minutes: 60
    environment:
      name: bazel
      deployment: false
    env:
      CARGO_INCREMENTAL: "0"
      SCCACHE_CACHE_SIZE: 2G
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@a8198c4bff370c8506180b035930dea56dbd5288 # v5
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: 22
          cache: pnpm

      - id: setup_ci
        uses: ./.github/actions/setup-ci

      - id: toolchain
        uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582 # 1.95.0

      - name: Restore Cargo dependency cache
        uses: actions/cache@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5.0.4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
          key: sdk-cargo-${{ runner.os }}-${{ hashFiles('codex-rs/Cargo.lock', 'codex-rs/rust-toolchain.toml') }}
          restore-keys: |
            sdk-cargo-${{ runner.os }}-

      - name: Select compiler cache policy
        id: compiler_cache_scope
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          cache_day="$(date -u +%Y%m%d)"
          may_save=false
          if [[ "$EVENT_NAME" == "push" && "$EVENT_REF" == "refs/heads/main" ]]; then
            may_save=true
          fi
          echo "cache-day=$cache_day" >> "$GITHUB_OUTPUT"
          echo "may-save=$may_save" >> "$GITHUB_OUTPUT"
          echo "SCCACHE_DIR=$RUNNER_TEMP/sccache" >> "$GITHUB_ENV"

      - name: Configure pinned voice SDK
        id: voice_sdk
        uses: ./.github/actions/setup-voice-sdk
        with:
          target: aarch64-apple-darwin
          toolchain-key: ${{ steps.toolchain.outputs.cachekey }}
          may-save: ${{ steps.compiler_cache_scope.outputs.may-save }}

      - name: Restore compiler object cache
        id: compiler_cache_restore
        uses: actions/cache/restore@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5.0.4
        with:
          path: ${{ runner.temp }}/sccache/
          key: sccache-v0.7.5-v1-sdk-${{ steps.setup_ci.outputs.cache-scope }}-${{ runner.os }}-${{ runner.arch }}-aarch64-apple-darwin-dev-small-toolchain-${{ steps.toolchain.outputs.cachekey }}-voice-${{ steps.voice_sdk.outputs.key }}-toolchain-file-${{ hashFiles('codex-rs/rust-toolchain.toml') }}-lock-${{ hashFiles('codex-rs/Cargo.lock') }}-trusted-main-${{ steps.compiler_cache_scope.outputs.cache-day }}
          restore-keys: |
            sccache-v0.7.5-v1-sdk-${{ steps.setup_ci.outputs.cache-scope }}-${{ runner.os }}-${{ runner.arch }}-aarch64-apple-darwin-dev-small-toolchain-${{ steps.toolchain.outputs.cachekey }}-voice-${{ steps.voice_sdk.outputs.key }}-toolchain-file-${{ hashFiles('codex-rs/rust-toolchain.toml') }}-lock-${{ hashFiles('codex-rs/Cargo.lock') }}-trusted-main-

      - name: Install sccache
        uses: taiki-e/install-action@44c6d64aa62cd779e873306675c7a58e86d6d532 # v2.62.49
        with:
          tool: sccache@0.7.5

      - name: Enable sccache
        shell: bash
        run: echo "RUSTC_WRAPPER=sccache" >> "$GITHUB_ENV"

      - name: Configure rusty_v8 artifact overrides
        uses: ./.github/actions/setup-rusty-v8
        with:
          target: aarch64-apple-darwin
          artifact-repository: openai/codex

      - name: Build and stage codex and the code-mode host with Cargo
        id: cargo_build
        timeout-minutes: 45
        working-directory: codex-rs
        shell: bash
        run: |
          set -euo pipefail
          cargo build --locked \
            --target aarch64-apple-darwin \
            --profile dev-small \
            -p codex-cli --bin codex \
            -p codex-code-mode-host --bin codex-code-mode-host

          # Stage both binaries together so the CLI can discover its sibling
          # code-mode host while the SDK tests spawn the CLI directly.
          install_dir="${GITHUB_WORKSPACE}/.tmp/sdk-ci"
          mkdir -p "${install_dir}"
          install -m 755 \
            "${CARGO_TARGET_DIR}/aarch64-apple-darwin/dev-small/codex" \
            "${CARGO_TARGET_DIR}/aarch64-apple-darwin/dev-small/codex-code-mode-host" \
            "${install_dir}"
          cp -R \
            "${CARGO_TARGET_DIR}/aarch64-apple-darwin/debug/lib" \
            "${install_dir}/lib"
          echo "CODEX_EXEC_PATH=${install_dir}/codex" >> "$GITHUB_ENV"

      - name: Report sccache statistics
        id: sccache_report
        if: always() && !cancelled()
        continue-on-error: true
        shell: bash
        run: |
          set -uo pipefail
          set +e
          sccache --show-stats
          stats_status=$?
          sccache --stop-server
          stop_status=$?
          set -e
          if [[ "$stop_status" -eq 0 ]]; then
            echo "cache-ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::sccache server shutdown failed; cache save is disabled"
          fi
          if [[ "$stats_status" -ne 0 ]]; then
            exit "$stats_status"
          fi
          exit "$stop_status"

      - name: Save compiler object cache
        if: always() && !cancelled() && steps.compiler_cache_scope.outputs.may-save == 'true' && steps.cargo_build.outcome == 'success' && steps.sccache_report.outputs.cache-ready == 'true' && steps.compiler_cache_restore.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5.0.4
        with:
          path: ${{ runner.temp }}/sccache/
          key: sccache-v0.7.5-v1-sdk-${{ steps.setup_ci.outputs.cache-scope }}-${{ runner.os }}-${{ runner.arch }}-aarch64-apple-darwin-dev-small-toolchain-${{ steps.toolchain.outputs.cachekey }}-voice-${{ steps.voice_sdk.outputs.key }}-toolchain-file-${{ hashFiles('codex-rs/rust-toolchain.toml') }}-lock-${{ hashFiles('codex-rs/Cargo.lock') }}-trusted-main-${{ steps.compiler_cache_scope.outputs.cache-day }}

      - name: Exercise the staged Cargo-built codex
        shell: bash
        run: |
          set -euo pipefail
          "${CODEX_EXEC_PATH}" --version

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build SDK packages
        run: pnpm -r --filter ./sdk/typescript run build

      - name: Exercise staged code-mode host discovery
        env:
          CODEX_SDK_CODE_MODE_HOST_SMOKE: "1"
        run: pnpm --dir sdk/typescript exec jest tests/codeModeHost.test.ts --runInBand

      - name: Lint SDK packages
        run: pnpm -r --filter ./sdk/typescript run lint

      - name: Test SDK packages
        run: pnpm -r --filter ./sdk/typescript run test

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.3"
          # The pinned schema generator cannot start on Python 3.14.
          python-version: "3.13"

      - name: Test Python SDK against the same CLI
        working-directory: sdk/python
        run: |
          uv sync --only-group dev --frozen
          uv run --only-group dev --frozen --no-sync ruff check --output-format=github .
          uv run --only-group dev --frozen --no-sync ruff format --check .
          uv run --only-group dev --frozen --no-sync pytest

      - name: Check for a clean worktree
        if: always() && !cancelled()
        uses: ./.github/actions/check-clean-worktree
